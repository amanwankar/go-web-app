```yaml
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'helm/**'

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Dependencies
        run: go mod download

      - name: Verify Dependencies
        run: go mod verify

      - name: Build Application
        run: go build -v -o go-web-app .

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Check Go Formatting
        run: |
          test -z "$(gofmt -l .)"

      - name: Run Go Vet
        run: go vet ./...
```

