name: CD

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build Go App
        run: go build -o go-web-app

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.sha }}

          docker tag ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.sha }} \
                     ${{ secrets.DOCKER_USERNAME }}/go-web-app:latest

          docker push ${{ secrets.DOCKER_USERNAME }}/go-web-app:latest
