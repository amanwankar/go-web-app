name: Go Web App CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Download Dependencies
        run: go mod download

      - name: Verify Dependencies
        run: go mod verify

      - name: Build Application
        run: go build -o go-web-app .

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.sha }} .
          docker tag ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.sha }} \
                     ${{ secrets.DOCKER_USERNAME }}/go-web-app:latest

      - name: Push Docker Images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/go-web-app:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/go-web-app:latest