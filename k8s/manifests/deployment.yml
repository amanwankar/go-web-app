apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-web-app
  labels:
    app: go-web-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-web-app
  template:
    metadata:
      labels:
        app: go-web-app
    spec:
      serviceAccountName: go-web-sa 
      containers:
        - name: go-web-app
          image: amanwankar18/go-web-app:v1
          ports:
            - containerPort: 8081
